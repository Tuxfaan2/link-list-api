name: Release Management

on:
  workflow_dispatch:
    inputs:
      version_bump:
        type: choice
        description: Version bump type
        required: true
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - 'release/**'

jobs:
  create-release-branch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Create release branch
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract current version
        id: current_version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate release version
        id: release_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          VERSION="${CURRENT%-SNAPSHOT}"

          IFS='.' read -r -a parts <<< "$VERSION"
          MAJOR="${parts[0]}"
          MINOR="${parts[1]}"
          PATCH="${parts[2]}"

          case "${{ github.event.inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $RELEASE_VERSION"

      - name: Create and push release branch
        run: |
          RELEASE_VERSION="${{ steps.release_version.outputs.version }}"
          BRANCH_NAME="release/$RELEASE_VERSION"

          git checkout -b "$BRANCH_NAME"

          mvn versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

          git add pom.xml
          git commit -m "Prepare release $RELEASE_VERSION"
          git push origin "$BRANCH_NAME"

          echo "Created and pushed branch: $BRANCH_NAME"

  finalize-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    name: Finalize release and build artifacts
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from branch
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${BRANCH_NAME#release/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Generate Typescript Client
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: typescript-fetch
          config-file: .config/openapi-generator-config.json
          openapi-file: src/main/resources/specification/link-list-api.yaml
          command-args: --additional-properties=npmVersion=${{ steps.version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tuxfaan2'

      - name: Publish TypeScript client
        run: |
          cd typescript-fetch-client/
          npm i
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Log in to Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          platforms: linux/arm64
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }},ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }}

            ## Docker Image
            `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}`

            ## TypeScript Client
            `@tuxfaan2/link-list-api@${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to main
        run: |
          git fetch origin main
          git checkout main
          git merge --no-ff ${{ github.ref }} -m "Merge release ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Update develop to next snapshot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r -a parts <<< "$VERSION"
          MAJOR="${parts[0]}"
          MINOR="${parts[1]}"
          PATCH="${parts[2]}"

          PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="$MAJOR.$MINOR.$PATCH-SNAPSHOT"

          git fetch origin develop
          git checkout develop

          mvn versions:set -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false

          git add pom.xml
          git commit -m "Prepare next development iteration: $NEXT_SNAPSHOT"
          git push origin develop

          echo "Updated develop to $NEXT_SNAPSHOT"
