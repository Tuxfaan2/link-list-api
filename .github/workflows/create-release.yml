name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: The release-type
        options:
          - patch
          - minor
          - major
jobs:
  release:
    runs-on: ubuntu-latest
    name: Create release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup git Config
        run: |
          git config --global user.name "Release"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract Maven version (without -SNAPSHOT)
        id: maven_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION=${VERSION%-SNAPSHOT}
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          BRANCH_NAME="release/${{ steps.maven_version.outputs.release_version }}"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
      - name: Set release version
        run: |
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion=${{ steps.maven_version.outputs.release_version }}
      - name: Push and commit release branch
        run: |
          BRANCH_NAME="release/${{ steps.maven_version.outputs.release_version }}"
          git add .
          git commit -m "Update version to ${{ steps.maven_version.outputs.release_version }}"
          git push origin "$BRANCH_NAME"